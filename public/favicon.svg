<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e8cd" />
      <stop offset="45%" stop-color="#c8a45a" />
      <stop offset="100%" stop-color="#9d7a36" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
